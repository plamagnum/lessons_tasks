server {
    listen 80;
    server_name localhost;

    # Коренева директорія для статичних файлів
    root /var/www/html/public;
    index index.html;

    # Увімкнення gzip стиснення
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 256;

    # Обробка статичних файлів (HTML, CSS, JS)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксування API запитів до PHP-FPM
    location /api/ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api/index.php;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param PATH_INFO $uri;
    }

    # Кешування статичних ресурсів
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
